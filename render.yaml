services:
  - type: redis
    name: projeto-miranda-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: projeto-miranda-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash backend/build.sh
    startCommand: cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DEBUG
        value: "false"
      - key: TIME_ZONE
        value: America/Sao_Paulo
      - key: LANGUAGE_CODE
        value: pt-br
      - key: ALLOWED_HOSTS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: DB_SSL_REQUIRED
        value: "true"
      - key: BACKUP_PROVIDER
        value: aiven
      - key: BACKUP_FREQUENCY_HOURS
        value: "24"
      - key: BACKUP_MIN_RETENTION_DAYS
        value: "30"
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_RESTORE_TEST_INTERVAL_DAYS
        value: "30"
      - key: BACKUP_LAST_RESTORE_TEST_AT
        sync: false
      - key: BACKUP_EVIDENCE_URL
        sync: false
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: FRONTEND_URL
        value: https://projeto-miranda-1wyn.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://projeto-miranda-1wyn.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://projeto-miranda-1wyn.onrender.com
      - key: PUSH_DISPATCH_ON_PUBLISH
        value: "true"
      - key: PUSH_DISPATCH_ASYNC
        value: "true"
      - key: MANAGER_TOKEN_TTL_SECONDS
        value: "28800"
      - key: MANAGER_TOKEN_ROTATE_ON_LOGIN
        value: "true"
      - key: API_PAGE_SIZE
        value: "20"
      - key: THROTTLE_ANON_RATE
        value: "100/hour"
      - key: THROTTLE_USER_RATE
        value: "1000/hour"
      - key: CACHE_TIMEOUT
        value: "300"
      - key: VIDEO_COMPRESSION_ENABLED
        value: "true"
      - key: VIDEO_COMPRESSION_MAX_DIMENSION
        value: "1280"
      - key: VIDEO_COMPRESSION_CRF
        value: "28"
      - key: VIDEO_COMPRESSION_PRESET
        value: medium
      - key: VIDEO_COMPRESSION_AUDIO_BITRATE
        value: 96k
      - key: VIDEO_COMPRESSION_TIMEOUT_SECONDS
        value: "180"
      - key: MAX_COMPRESSED_VIDEO_SIZE_MB
        value: "60"
      - key: REDIS_URL
        fromService:
          type: redis
          name: projeto-miranda-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: FIREBASE_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: worker
    name: projeto-miranda-celery-worker
    runtime: python
    plan: free
    rootDir: .
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && celery -A core worker --loglevel=info --concurrency=2
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DEBUG
        value: "false"
      - key: TIME_ZONE
        value: America/Sao_Paulo
      - key: LANGUAGE_CODE
        value: pt-br
      - key: ALLOWED_HOSTS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: DB_SSL_REQUIRED
        value: "true"
      - key: BACKUP_PROVIDER
        value: aiven
      - key: BACKUP_FREQUENCY_HOURS
        value: "24"
      - key: BACKUP_MIN_RETENTION_DAYS
        value: "30"
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_RESTORE_TEST_INTERVAL_DAYS
        value: "30"
      - key: BACKUP_LAST_RESTORE_TEST_AT
        sync: false
      - key: BACKUP_EVIDENCE_URL
        sync: false
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: PUSH_DISPATCH_ON_PUBLISH
        value: "true"
      - key: PUSH_DISPATCH_ASYNC
        value: "true"
      - key: MANAGER_TOKEN_TTL_SECONDS
        value: "28800"
      - key: MANAGER_TOKEN_ROTATE_ON_LOGIN
        value: "true"
      - key: CACHE_TIMEOUT
        value: "300"
      - key: VIDEO_COMPRESSION_ENABLED
        value: "true"
      - key: VIDEO_COMPRESSION_MAX_DIMENSION
        value: "1280"
      - key: VIDEO_COMPRESSION_CRF
        value: "28"
      - key: VIDEO_COMPRESSION_PRESET
        value: medium
      - key: VIDEO_COMPRESSION_AUDIO_BITRATE
        value: 96k
      - key: VIDEO_COMPRESSION_TIMEOUT_SECONDS
        value: "180"
      - key: MAX_COMPRESSED_VIDEO_SIZE_MB
        value: "60"
      - key: REDIS_URL
        fromService:
          type: redis
          name: projeto-miranda-redis
          property: connectionString
      - key: FIREBASE_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: worker
    name: projeto-miranda-celery-beat
    runtime: python
    plan: free
    rootDir: .
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && celery -A core beat --loglevel=info
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DEBUG
        value: "false"
      - key: TIME_ZONE
        value: America/Sao_Paulo
      - key: LANGUAGE_CODE
        value: pt-br
      - key: ALLOWED_HOSTS
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: DB_SSL_REQUIRED
        value: "true"
      - key: BACKUP_PROVIDER
        value: aiven
      - key: BACKUP_FREQUENCY_HOURS
        value: "24"
      - key: BACKUP_MIN_RETENTION_DAYS
        value: "30"
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_RESTORE_TEST_INTERVAL_DAYS
        value: "30"
      - key: BACKUP_LAST_RESTORE_TEST_AT
        sync: false
      - key: BACKUP_EVIDENCE_URL
        sync: false
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: PUSH_DISPATCH_ASYNC
        value: "true"
      - key: MANAGER_TOKEN_TTL_SECONDS
        value: "28800"
      - key: CACHE_TIMEOUT
        value: "300"
      - key: REDIS_URL
        fromService:
          type: redis
          name: projeto-miranda-redis
          property: connectionString
