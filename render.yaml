services:
  - type: web
    name: projeto-miranda-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash backend/build.sh
    startCommand: cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DEBUG
        value: "false"
      - key: TIME_ZONE
        value: America/Sao_Paulo
      - key: LANGUAGE_CODE
        value: pt-br
      - key: SECRET_KEY
        generateValue: true
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: DB_SSL_REQUIRED
        value: "true"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: PUSH_DISPATCH_ON_PUBLISH
        value: "true"
      - key: FIREBASE_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
